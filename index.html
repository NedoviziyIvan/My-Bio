<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #FFFFFF;
    color: #1A1A1A;
    font-family: 'Plus Jakarta Sans', 'Inter', 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(30px, 8dvh, 70px); 
    padding: 0 16px env(safe-area-inset-bottom, 0px);
  }

  header { 
    text-align: center; 
    margin-top: -80px; 
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-family: 'Tinos', 'Times New Roman', Times, serif;
    font-size: clamp(34px, 4.5dvh + 1vw, 44px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: #1A1A1A;
  }

  .subtitle {
    margin-top: clamp(4px, 1dvh, 10px);
    font-size: clamp(13px, 2.2dvh + 0.3vw, 20px);
    font-weight: 500;
    letter-spacing: 0.32em;
    text-indent: 0.32em; 
    color: #1A1A1A;
    opacity: 0.6;
  }

  .stats-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 100;
  }

  .stat-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #1A1A1A;
    opacity: 0.65;
    background: rgba(0, 0, 0, 0.04);
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.03em;
  }

  .stat-badge.views svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    display: block;
    position: relative;
  }

  .eye-open {
    animation: blink-open 10.6s infinite ease-in-out;
  }

  .eye-closed {
    animation: blink-closed 10.6s infinite ease-in-out;
  }

  @keyframes blink-open {
    0%, 88%, 96%, 100% { opacity: 1; }
    90%, 94% { opacity: 0; }
  }

  @keyframes blink-closed {
    0%, 88%, 96%, 100% { opacity: 0; }
    90%, 94% { opacity: 1; }
  }

  .online-dot {
    width: 8px;
    height: 8px;
    background-color: #22c55e;
    border-radius: 50%;
    display: inline-block;
    position: relative;
  }

  .online-dot::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background-color: rgba(34, 197, 94, 0.45);
    animation: pulse-dot 5.3s infinite ease-in-out;
  }

  @keyframes pulse-dot {
    0% { transform: scale(0.6); opacity: 0.8; }
    50% { transform: scale(1.7); opacity: 0; }
    100% { transform: scale(0.8); opacity: 0; }
  }

  /* ---------- КНОПКИ ---------- */
  .grid {
    --gap: clamp(12px, 2.6dvh, 22px);
    --size: min(40vw, 22dvh, 190px);
    display: grid;
    grid-template-columns: repeat(2, var(--size));
    grid-template-rows: repeat(2, var(--size));
    gap: var(--gap);
  }

  .btn {
    --brand: #000;
    position: relative;
    display: block;
    width: var(--size);
    height: var(--size);
    border-radius: clamp(18px, 3.4dvh, 24px);
    background: var(--brand);
    text-decoration: none;
    color: inherit;
    outline: none;
    isolation: isolate;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn.telegram { --brand: #0088cc; }
  .btn.tiktok   { --brand: #000000; --accent: #00f2fe; }
  .btn.youtube  { --brand: #FF0000; }
  .btn.discord  { --brand: #5865F2; }

  .glass {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.88) 45%, rgba(255,255,255,0.78) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,1),
      inset 0 0 0 1px rgba(255,255,255,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: scale(1);
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .glass::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0));
    border-radius: inherit;
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .icon {
    position: relative;
    width: 38%;
    height: 38%;
    color: #1A1A1A;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(-12%) scale(1);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
  }
  .icon svg { width: 100%; height: 100%; fill: currentColor; display: block; }

  .label {
    position: absolute;
    left: 0; right: 0;
    top: 62%;
    text-align: center;
    font-size: clamp(10px, 1.7dvh, 13px);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    color: #1A1A1A;
    opacity: 1;
    transform: translateY(0);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }

  /* ---------- Hover / Active / Focus ---------- */
  .btn:hover .glass,
  .btn:active .glass,
  .btn:focus-visible .glass {
    transform: scale(0.92);
    background: var(--brand);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .btn:hover .glass::before,
  .btn:active .glass::before,
  .btn:focus-visible .glass::before { opacity: 0.18; }

  .btn:hover .icon,
  .btn:active .icon,
  .btn:focus-visible .icon {
    transform: translateY(0) scale(1.15);
    color: #FFFFFF;
  }
  .btn.tiktok:hover .icon,
  .btn.tiktok:active .icon,
  .btn.tiktok:focus-visible .icon { color: #FFFFFF; filter: drop-shadow(1.5px 1.5px 0 #fe2c55) drop-shadow(-1.5px -1.5px 0 #00f2fe); }

  .btn:hover .label,
  .btn:active .label,
  .btn:focus-visible .label {
    opacity: 0;
    transform: translateY(-140%);
  }

  .btn:active { transform: scale(0.98); }

  @media (prefers-reduced-motion: reduce) {
    .btn, .glass, .icon, .label, .glass::before { transition-duration: 0.01s; }
  }
</style>

<body>

<!-- Подключение Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  ['touchmove', 'wheel'].forEach(function (evt) {
    document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
  });

  document.querySelectorAll('.btn').forEach(function (btn) {
    btn.addEventListener('touchstart', function () {}, { passive: true });
  });

  // Твоя настоящая конфигурация Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAk-dFcweuXQJSK5xYMinDLoabU2FDZZww",
    authDomain: "lolovilka-site.firebaseapp.com",
    projectId: "lolovilka-site",
    storageBucket: "lolovilka-site.firebasestorage.app",
    messagingSenderId: "706798647797",
    appId: "1:706798647797:web:6f1c3a7feeea833f4408bc",
    measurementId: "G-4DJFQ9229D",
    databaseURL: "https://lolovilka-site-default-rtdb.europe-west1.firebasedatabase.app"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 1. Счётчик ВСЕХ просмотров (Глазик)
  const viewsRef = db.ref('stats/total_views');
  
  if (!sessionStorage.getItem('visited')) {
    viewsRef.transaction(current => (current || 0) + 1);
    sessionStorage.setItem('visited', 'true');
  }

  viewsRef.on('value', snapshot => {
    const val = snapshot.val() || 1;
    document.getElementById('view-counter').textContent = val.toLocaleString();
  });

  // 2. Синхронный живой онлайн (Зелёная точка)
  const connectedRef = db.ref('.info/connected');
  const myPresenceRef = db.ref('stats/online').push();

  connectedRef.on('value', snap => {
    if (snap.val() === true) {
      myPresenceRef.onDisconnect().remove();
      myPresenceRef.set(true);
    }
  });

  db.ref('stats/online').on('value', snap => {
    const count = snap.numChildren() || 1;
    document.getElementById('online-counter').textContent = count;
  });
</script>
